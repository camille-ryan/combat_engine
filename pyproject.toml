[project]
name = "combat-engine"
version = "0.1.0"
description = "A deterministic grid combat engine for a 4e-style tactical ruleset."
requires-python = ">=3.13"
dependencies = [
    "lxml>=5.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.34"]
# Reading a module you supply yourself out of a PDF. Optional because the
# engine plays a module perfectly well without ever having seen one -- the
# import step is a one-off, and a `.txt` or `.md` adventure skips it entirely.
modules = ["pypdf>=5.1", "regex>=2024.5"]
# The model that narrates a campaign (#794). Optional because `--no-dm` is a
# first-class mode and is the one `check.py` runs: an instrument that needs a
# network and an API key goes red for the wrong reason.
dm = ["anthropic>=0.69"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/combat_engine"]

[dependency-groups]
dev = [
    "coverage>=7.6",
    "import-linter>=2.0",
    "playwright>=1.63.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "TID"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Package roots re-export deliberately; content files import the engine as a
# namespace and are data, not logic.
"**/__init__.py" = ["F401", "F403"]
"src/combat_engine/content/**" = ["F403", "F405"]
